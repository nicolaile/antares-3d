<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preload" href="/fonts/NeueHaasUnicaPro-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/Executive-Medium.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// Runs before first paint so the correct theme is already on <html>.
			// Stored choice wins; otherwise follow the OS. Wrapped because
			// localStorage throws in some privacy modes.
			try {
				var t = localStorage.getItem('theme');
				if (t !== 'dark' && t !== 'light') {
					t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
